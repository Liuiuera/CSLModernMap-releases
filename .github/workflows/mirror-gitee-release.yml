name: Sync macOS release to Gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag
        type: string
        required: true
      apply:
        description: Write changes to Gitee
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GITEE_APPLY: ${{ inputs.apply }}
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: |
          args=("$RELEASE_TAG")
          if [[ "$GITEE_APPLY" == true ]]; then
            args+=(--apply)
          fi
          python3 scripts/mirror_gitee_release.py "${args[@]}"
